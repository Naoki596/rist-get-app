<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unity X Finder</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #f5f7fa;
  color: #1a1a1a;
  line-height: 1.6;
  padding: 0;
}

header {
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  gap: 12px;
}

header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: #1a1a1a;
}

header .subtitle {
  font-size: 0.85rem;
  color: #666;
}

.container {
  max-width: 1200px;
  margin: 24px auto;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  padding: 20px 24px;
}

.card h2 {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 16px;
  color: #333;
  border-bottom: 2px solid #e8e8e8;
  padding-bottom: 8px;
}

/* Settings form */
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 24px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.form-group label {
  font-size: 0.85rem;
  font-weight: 500;
  color: #444;
}

.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="password"] {
  padding: 8px 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 0.9rem;
  font-family: inherit;
  transition: border-color 0.15s;
}

.form-group input:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.form-group.full-width {
  grid-column: 1 / -1;
}

.checkbox-group {
  grid-column: 1 / -1;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: #fffbeb;
  border: 1px solid #fcd34d;
  border-radius: 6px;
}

.checkbox-group input[type="checkbox"] {
  margin-top: 3px;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.checkbox-group .cb-label {
  font-size: 0.85rem;
  color: #444;
}

.checkbox-group .cb-warning {
  font-size: 0.78rem;
  color: #b45309;
  margin-top: 2px;
}

/* Buttons */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.btn {
  padding: 9px 20px;
  border: none;
  border-radius: 6px;
  font-size: 0.9rem;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: #3b82f6;
  color: #fff;
}

.btn-primary:hover:not(:disabled) {
  background: #2563eb;
}

.btn-danger {
  background: #ef4444;
  color: #fff;
}

.btn-danger:hover:not(:disabled) {
  background: #dc2626;
}

.btn-secondary {
  background: #6b7280;
  color: #fff;
}

.btn-secondary:hover:not(:disabled) {
  background: #4b5563;
}

.btn-outline {
  background: #fff;
  color: #374151;
  border: 1px solid #d1d5db;
}

.btn-outline:hover:not(:disabled) {
  background: #f3f4f6;
}

/* Status bar */
.status-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 10px 16px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  font-size: 0.85rem;
}

.status-bar .status-text {
  color: #555;
  flex: 1;
}

.status-bar .request-count {
  font-weight: 600;
  color: #3b82f6;
  white-space: nowrap;
}

/* Results table */
.table-wrapper {
  overflow-x: auto;
  max-height: 500px;
  overflow-y: auto;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

thead {
  position: sticky;
  top: 0;
  z-index: 1;
}

thead th {
  background: #f3f4f6;
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  color: #374151;
  border-bottom: 2px solid #e5e7eb;
  white-space: nowrap;
}

tbody tr:nth-child(even) {
  background: #f9fafb;
}

tbody tr:hover {
  background: #eef2ff;
}

tbody td {
  padding: 8px 12px;
  border-bottom: 1px solid #f0f0f0;
  color: #444;
}

tbody td a {
  color: #3b82f6;
  text-decoration: none;
}

tbody td a:hover {
  text-decoration: underline;
}

.empty-row td {
  text-align: center;
  color: #999;
  padding: 24px 12px;
}

/* Log area */
.log-area {
  width: 100%;
  height: 180px;
  padding: 10px 14px;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  background: #1e1e1e;
  color: #d4d4d4;
  font-family: "Consolas", "Menlo", "Monaco", monospace;
  font-size: 0.8rem;
  line-height: 1.5;
  overflow-y: auto;
  resize: vertical;
  white-space: pre-wrap;
  word-break: break-all;
}
</style>
</head>
<body>

<header>
  <h1>Unity X Finder</h1>
  <span class="subtitle">Qiita / Zenn の Unity 記事著者から X アカウントを収集</span>
</header>

<div class="container">

  <!-- Settings -->
  <div class="card">
    <h2>設定</h2>
    <div class="settings-grid">
      <div class="form-group">
        <label for="tag">タグ</label>
        <input type="text" id="tag" value="Unity">
      </div>
      <div class="form-group">
        <label for="qiita_count">Qiita取得件数</label>
        <input type="number" id="qiita_count" value="100" min="10" max="1000" step="10">
      </div>
      <div class="form-group">
        <label for="zenn_count">Zenn取得件数</label>
        <input type="number" id="zenn_count" value="100" min="10" max="1000" step="10">
      </div>
      {% if has_server_token %}
      <div class="form-group">
        <label>Qiitaトークン</label>
        <div style="padding:8px 12px;border:1px solid #d1fae5;border-radius:6px;background:#f0fdf4;color:#166534;font-size:0.85rem;">
          ✓ サーバーで設定済み
        </div>
        <input type="hidden" id="qiita_token" value="">
      </div>
      {% else %}
      <div class="form-group">
        <label for="qiita_token">Qiitaトークン（任意）</label>
        <input type="password" id="qiita_token" value="" placeholder="未設定でも動作します（レート制限あり）">
      </div>
      {% endif %}
      <div class="form-group">
        <label for="max_requests">リクエスト上限</label>
        <input type="number" id="max_requests" value="300" min="50" max="2000" step="50">
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="scan_body">
        <div>
          <div class="cb-label">記事本文中の @ユーザー名 / x.com リンクも抽出する</div>
          <div class="cb-warning">※ 記事ごとに追加リクエストが発生するため、API呼び出し数が大幅に増加します。</div>
        </div>
      </div>
    </div>

    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-primary" id="btn-start">収集開始</button>
      <button class="btn btn-danger" id="btn-cancel" disabled>中断</button>
      <button class="btn btn-secondary" id="btn-csv" disabled>CSV保存</button>
      <button class="btn btn-outline" id="btn-clear">クリア</button>
    </div>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <span class="status-text" id="status-text">待機中</span>
    <span class="request-count" id="request-count">リクエスト: 0</span>
  </div>

  <!-- Results -->
  <div class="card">
    <h2>結果 <span id="result-count" style="font-weight:400;color:#888;font-size:0.85rem;"></span></h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ソース</th>
            <th>Xハンドル</th>
            <th>著者</th>
            <th>記事タイトル</th>
            <th>記事URL</th>
            <th>検出元</th>
          </tr>
        </thead>
        <tbody id="results-body">
          <tr class="empty-row"><td colspan="6">まだ結果がありません</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Log -->
  <div class="card">
    <h2>ログ</h2>
    <div class="log-area" id="log-area"></div>
  </div>

</div>

<script>
(function () {
  "use strict";

  let jobId = null;
  let pollTimer = null;
  let renderedResultCount = 0;
  let renderedLogCount = 0;
  let hasResults = false;
  let consecutiveErrors = 0;
  const MAX_CONSECUTIVE_ERRORS = 3;

  const $tag = document.getElementById("tag");
  const $qiitaCount = document.getElementById("qiita_count");
  const $zennCount = document.getElementById("zenn_count");
  const $qiitaToken = document.getElementById("qiita_token");
  const $scanBody = document.getElementById("scan_body");
  const $maxRequests = document.getElementById("max_requests");

  const $btnStart = document.getElementById("btn-start");
  const $btnCancel = document.getElementById("btn-cancel");
  const $btnCsv = document.getElementById("btn-csv");
  const $btnClear = document.getElementById("btn-clear");

  const $statusText = document.getElementById("status-text");
  const $requestCount = document.getElementById("request-count");
  const $resultsBody = document.getElementById("results-body");
  const $resultCount = document.getElementById("result-count");
  const $logArea = document.getElementById("log-area");

  function setRunning(running) {
    $btnStart.disabled = running;
    $btnCancel.disabled = !running;
    $tag.disabled = running;
    $qiitaCount.disabled = running;
    $zennCount.disabled = running;
    if ($qiitaToken && $qiitaToken.type !== "hidden") $qiitaToken.disabled = running;
    $scanBody.disabled = running;
    $maxRequests.disabled = running;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function appendLog(msg) {
    $logArea.textContent += msg + "\n";
    $logArea.scrollTop = $logArea.scrollHeight;
  }

  function clearResults() {
    $resultsBody.innerHTML = '<tr class="empty-row"><td colspan="6">まだ結果がありません</td></tr>';
    renderedResultCount = 0;
    hasResults = false;
    $resultCount.textContent = "";
    $btnCsv.disabled = true;
  }

  function addResultRow(r) {
    if (!hasResults) {
      $resultsBody.innerHTML = "";
      hasResults = true;
    }
    const tr = document.createElement("tr");

    const tdSource = document.createElement("td");
    tdSource.textContent = r.source;
    tr.appendChild(tdSource);

    const tdHandle = document.createElement("td");
    const handleLink = document.createElement("a");
    handleLink.href = "https://x.com/" + encodeURIComponent(r.handle);
    handleLink.target = "_blank";
    handleLink.rel = "noopener noreferrer";
    handleLink.textContent = "@" + r.handle;
    tdHandle.appendChild(handleLink);
    tr.appendChild(tdHandle);

    const tdAuthor = document.createElement("td");
    tdAuthor.textContent = r.author;
    tr.appendChild(tdAuthor);

    const tdTitle = document.createElement("td");
    tdTitle.textContent = r.article_title;
    tr.appendChild(tdTitle);

    const tdUrl = document.createElement("td");
    const urlLink = document.createElement("a");
    urlLink.href = r.article_url;
    urlLink.target = "_blank";
    urlLink.rel = "noopener noreferrer";
    urlLink.textContent = r.article_url;
    tdUrl.appendChild(urlLink);
    tr.appendChild(tdUrl);

    const tdDetected = document.createElement("td");
    tdDetected.textContent = r.detected_by;
    tr.appendChild(tdDetected);

    $resultsBody.appendChild(tr);
  }

  async function startCollection() {
    if ($scanBody.checked) {
      const ok = confirm(
        "本文スキャンを有効にすると、記事ごとに追加のAPIリクエストが発生し、" +
        "呼び出し数が大幅に増加します。続行しますか？"
      );
      if (!ok) return;
    }

    clearResults();
    $logArea.textContent = "";
    renderedLogCount = 0;
    $statusText.textContent = "開始中...";
    $requestCount.textContent = "リクエスト: 0";
    setRunning(true);

    try {
      const resp = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          tag: $tag.value.trim(),
          qiita_count: parseInt($qiitaCount.value, 10),
          zenn_count: parseInt($zennCount.value, 10),
          qiita_token: $qiitaToken.value.trim() || "",
          scan_body: $scanBody.checked,
          max_requests: parseInt($maxRequests.value, 10)
        })
      });

      if (!resp.ok) {
        throw new Error("サーバーエラー: " + resp.status);
      }

      const data = await resp.json();
      jobId = data.job_id;
      $statusText.textContent = "収集中...";
      appendLog("[INFO] ジョブ開始: " + jobId);
      startPolling();
    } catch (e) {
      $statusText.textContent = "エラー: " + e.message;
      appendLog("[ERROR] " + e.message);
      setRunning(false);
    }
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    consecutiveErrors = 0;
    pollTimer = setInterval(pollStatus, 1500);
  }

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  async function pollStatus() {
    if (!jobId) return;

    try {
      const resp = await fetch("/api/status/" + jobId);

      // 404 = サーバー再起動等でジョブが消えた → 即停止
      if (resp.status === 404) {
        stopPolling();
        setRunning(false);
        $statusText.textContent = "エラー: ジョブが見つかりません（サーバーが再起動した可能性があります）";
        appendLog("[ERROR] ジョブが消失しました。収集をやり直してください。");
        return;
      }

      if (!resp.ok) throw new Error("ステータス取得失敗: " + resp.status);

      consecutiveErrors = 0;
      const data = await resp.json();

      // Update request count
      if (data.request_count !== undefined) {
        $requestCount.textContent = "リクエスト: " + data.request_count;
      }

      // Append new results
      if (data.results && data.results.length > renderedResultCount) {
        for (let i = renderedResultCount; i < data.results.length; i++) {
          addResultRow(data.results[i]);
        }
        renderedResultCount = data.results.length;
        $resultCount.textContent = "(" + renderedResultCount + " 件)";
        $btnCsv.disabled = false;
      }

      // Append new logs
      if (data.logs && data.logs.length > renderedLogCount) {
        for (let i = renderedLogCount; i < data.logs.length; i++) {
          appendLog(data.logs[i]);
        }
        renderedLogCount = data.logs.length;
      }

      // Check status
      if (data.status === "completed") {
        $statusText.textContent = "完了 (" + renderedResultCount + " 件取得)";
        stopPolling();
        setRunning(false);
      } else if (data.status === "error") {
        $statusText.textContent = "エラーで終了";
        stopPolling();
        setRunning(false);
      } else {
        $statusText.textContent = "収集中...";
      }
    } catch (e) {
      consecutiveErrors++;
      appendLog("[ERROR] ポーリングエラー: " + e.message);
      // 連続エラーが上限を超えたら自動停止
      if (consecutiveErrors >= MAX_CONSECUTIVE_ERRORS) {
        stopPolling();
        setRunning(false);
        $statusText.textContent = "エラー: サーバーに接続できません";
        appendLog("[ERROR] 接続エラーが続くため自動停止しました。ページを再読み込みして再試行してください。");
      }
    }
  }

  async function cancelCollection() {
    if (!jobId) return;
    try {
      await fetch("/api/cancel/" + jobId, { method: "POST" });
      appendLog("[INFO] 中断リクエストを送信しました");
      $statusText.textContent = "中断中...";
    } catch (e) {
      appendLog("[ERROR] 中断失敗: " + e.message);
    }
  }

  function downloadCsv() {
    if (!jobId) return;
    window.open("/api/csv/" + jobId, "_blank");
  }

  function clearAll() {
    stopPolling();
    jobId = null;
    renderedResultCount = 0;
    renderedLogCount = 0;
    clearResults();
    $logArea.textContent = "";
    $statusText.textContent = "待機中";
    $requestCount.textContent = "リクエスト: 0";
    setRunning(false);
  }

  $btnStart.addEventListener("click", startCollection);
  $btnCancel.addEventListener("click", cancelCollection);
  $btnCsv.addEventListener("click", downloadCsv);
  $btnClear.addEventListener("click", clearAll);
})();
</script>

</body>
</html>
